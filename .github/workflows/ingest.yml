name: Ambil literatur harian
on:
  schedule:
    - cron: '0 20 * * *'   # 20:00 UTC = 03:00 WIB
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Uji saja tanpa menulis (1 = ya)'
        default: '1'
      since:
        description: 'Ambil sejak tanggal (YYYY-MM-DD). Kosongkan untuk harian biasa.'
        default: ''
      max_pages:
        description: 'Halaman per topik (100 karya/halaman). Pengambilan awal: 40'
        default: '10'
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ingest.mjs
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '10' }}
          SINCE: ${{ github.event.inputs.since }}
